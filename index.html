<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>体重・運動記録</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:'Helvetica Neue',Arial,sans-serif;padding:15px;margin:0;background:#f7f9fa;color:#444}
.card{background:#fff;padding:24px;border-radius:20px;margin-bottom:20px;box-shadow:0 8px 16px rgba(0,0,0,0.04)}
h2{font-size:1.25em;margin-top:0;border-bottom:2px solid #f0f2f5;padding-bottom:12px;display:flex;justify-content:space-between;align-items:center;color:#333}
label{display:block;margin:16px 0 8px;font-weight:bold;font-size:14px;color:#555}
input[type="number"],input[type="text"],input[type="date"],select{width:100%;padding:14px;box-sizing:border-box;border:2px solid #e1e5e8;border-radius:12px;font-size:16px;background:#fafbfc;transition:0.2s}
input:focus,select:focus{border-color:#4facfe;outline:none;background:#fff}
.row{display:flex;gap:10px;margin-bottom:8px}.row > *{flex:1}
.checkbox-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.checkbox-group label{display:inline-flex;align-items:center;background:#f0f4f8;padding:12px 16px;border-radius:30px;font-weight:normal;margin:0;cursor:pointer;transition:0.2s;border:2px solid transparent;font-size:14px}
.checkbox-group input:checked + span{font-weight:bold}
.checkbox-group label:has(input:checked){border-color:currentColor;background:#fff}
.checkbox-group label:has(input:checked) .tag-ex{color:#28a745}
.checkbox-group label:has(input:checked:is(#exRun,#exMuscleUpper,#exMuscleLower,#exStretch)){border-color:#28a745;background:#f2fcf5}
.checkbox-group label:has(input:checked) .tag-rest{color:#6c757d}
.checkbox-group label:has(input:checked#exNone){border-color:#6c757d;background:#f8f9fa}
.checkbox-group.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.checkbox-group.grid label{justify-content:center;padding:12px 4px;border-radius:12px;text-align:center;}
.checkbox-group label:has(input:checked) .tag-warn{color:#dc3545}
.checkbox-group label:has(input:checked:is(#tagLunchOut,#tagDinnerOut,#tagAlcohol,#tagSalty,#tagNoBM,#tagWorkStress,#tagMusclePain)){border-color:#dc3545;background:#fff5f5}
.checkbox-group label:has(input:checked) .tag-info{color:#17a2b8}
.checkbox-group label:has(input:checked#tagHoliday){border-color:#17a2b8;background:#f0f9fa}
.checkbox-group input{display:none}.hidden{display:none !important}

/* 4段階の気分ボタン */
.mood-group{display:flex;gap:8px;margin-bottom:15px}
.mood-group label{flex:1;text-align:center;background:#f0f4f8;padding:12px 0;border-radius:14px;cursor:pointer;border:2px solid transparent;transition:0.2s;font-size:18px;font-weight:bold;color:#666}
.mood-group input{display:none}
.mood-group label:has(input[value="great"]:checked){background:#fff8e1;border-color:#ffb300;color:#d97706}
.mood-group label:has(input[value="good"]:checked){background:#f0fdf4;border-color:#22c55e;color:#16a34a}
.mood-group label:has(input[value="soso"]:checked){background:#f0f9ff;border-color:#0ea5e9;color:#0284c7}
.mood-group label:has(input[value="bad"]:checked){background:#fef2f2;border-color:#ef4444;color:#dc2626}

.snack-item{background:#f8f9fa;padding:16px;border-radius:16px;margin-bottom:12px;border:1px solid #e1e5e8;}
.btn-remove-snack{background:#ffe5e5;color:#dc3545;border:none;border-radius:10px;font-weight:bold;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
.btn-add-snack{background:transparent;color:#4facfe;border:2px dashed #4facfe;padding:14px;border-radius:12px;cursor:pointer;width:100%;font-weight:bold;margin-bottom:10px;font-size:15px;}

/* ボタングループ */
.btn-save-sub{background:#e2e8f0;color:#334155;border:none;padding:14px;width:100%;border-radius:14px;font-size:15px;font-weight:bold;margin-top:15px;cursor:pointer;transition:0.2s}
.btn-save-sub:active{background:#cbd5e1}
.btn-save-main{background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);color:#fff;border:none;padding:16px;width:100%;border-radius:16px;font-size:17px;font-weight:bold;margin-top:10px;cursor:pointer;box-shadow:0 6px 12px rgba(79,172,254,0.3);transition:0.2s}
.btn-save-main:active{transform:translateY(2px);box-shadow:0 2px 6px rgba(79,172,254,0.3)}
#quickSaveToast{font-size:13px;color:#16a34a;font-weight:bold;text-align:center;margin-top:8px;min-height:18px;}

.btn-export{background:#495057;color:#fff;border:none;padding:12px;border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer;}
.btn-zoom{background:#f0f4f8;color:#555;border:none;padding:10px;border-radius:12px;font-size:14px;cursor:pointer;width:100%;margin-top:10px;font-weight:bold}
.btn-group{display:flex;gap:8px;margin-bottom:15px}.btn-group button{flex:1;background:#f0f4f8;border:none;padding:12px;border-radius:12px;font-size:14px;color:#555;font-weight:bold}.btn-group button.active{background:#4facfe;color:#fff}
#historyContainer{max-height:450px;overflow-y:auto;font-size:14px;padding-right:5px}
#summaryContainer{background:#fff;padding:16px;border-radius:16px;margin-bottom:20px;color:#333;border:2px solid #e8f0f6;line-height:1.6}
#feedbackBanner{background:#e8f4fd;color:#0056b3;padding:16px;border-radius:16px;margin-bottom:20px;font-weight:bold;text-align:left;line-height:1.6;box-shadow:0 4px 8px rgba(0,86,179,0.05);border:1px solid #cce5ff}

/* 収支バッジ：マイナスが良（緑）、プラスが余剰（赤） */
.bal-box{display:inline-block;padding:4px 10px;border-radius:8px;font-size:13px;margin-top:4px;font-weight:bold}
.bal-good{background:#e6f4ea;color:#137333;}
.bal-over{background:#fce8e6;color:#c5221f;}

.prog-bg{background:#e1e5e8;border-radius:10px;height:14px;width:100%;margin:8px 0;overflow:hidden;}
.prog-bar{background:linear-gradient(90deg, #4facfe, #00f2fe);height:100%;transition:width 0.4s ease-out;}
#streakBadge{font-size:13px;background:linear-gradient(135deg, #f6d365 0%, #fda085 100%);color:#fff;padding:6px 12px;border-radius:20px;font-weight:bold;box-shadow:0 2px 6px rgba(253,160,133,0.3);cursor:pointer;}
#chartModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;box-sizing:border-box}
.modal-content{background:#fff;width:100%;border-radius:20px;padding:24px;box-sizing:border-box;position:relative}
.close-btn{position:absolute;top:10px;right:20px;font-size:28px;cursor:pointer;font-weight:bold;color:#999}
</style></head>
<body>
<div class="card">
  <h2>記録・修正 <span id="streakBadge">記録なし</span></h2>
  <div id="feedbackBanner" class="hidden"></div>
  <label>日付</label><input type="date" id="dateInput">
  <label>体重 (kg)</label><input type="number" step="0.1" id="weightInput" placeholder="例: 65.5">
  <label>今日の調子</label>
  <div class="mood-group">
    <label><input type="radio" name="mood" value="great"><span>◎</span></label>
    <label><input type="radio" name="mood" value="good"><span>○</span></label>
    <label><input type="radio" name="mood" value="soso"><span>△</span></label>
    <label><input type="radio" name="mood" value="bad"><span>✕</span></label>
  </div>
  <label>運動</label>
  <div class="checkbox-group">
    <label><input type="checkbox" id="exRun" value="run"><span class="tag-ex">ラン</span></label>
    <label><input type="checkbox" id="exMuscleUpper" value="upper"><span class="tag-ex">上半身/体幹</span></label>
    <label><input type="checkbox" id="exMuscleLower" value="lower"><span class="tag-ex">下半身</span></label>
    <label><input type="checkbox" id="exStretch" value="stretch"><span class="tag-ex">ストレッチ</span></label>
    <label><input type="checkbox" id="exNone" value="none"><span class="tag-rest">休養</span></label>
  </div>
  <div id="runDistWrapper" class="hidden"><label>距離(km)</label><input type="number" step="0.1" id="runDistInput" placeholder="例: 10"></div>
  <label>昼食</label>
  <div class="row" style="margin-bottom:5px;">
    <select id="lunchSelect"><option value="bento">弁当(持参)</option><option value="onigiri_low">おにぎり(低脂質)</option><option value="onigiri_high">おにぎり(高脂質)</option><option value="bread">パン</option><option value="other">その他</option></select>
    <input type="number" id="lunchCount" min="0" placeholder="個数(例:2)"><input type="text" id="lunchMemo" class="hidden" placeholder="内容(例:パスタ)">
  </div>
  <div class="row hidden" id="lunchRow2" style="margin-bottom:5px;">
    <select id="lunchSelect2"><option value="">-- 追加なし --</option><option value="bento">弁当(持参)</option><option value="onigiri_low">おにぎり(低脂質)</option><option value="onigiri_high">おにぎり(高脂質)</option><option value="bread">パン</option><option value="other">その他</option></select>
    <input type="number" id="lunchCount2" min="0" placeholder="個数"><input type="text" id="lunchMemo2" class="hidden" placeholder="内容">
  </div>
  <button type="button" id="btnAddLunch" class="btn-add-snack" style="border-width:1px;padding:8px;margin-bottom:15px;color:#6c757d;border-color:#ced4da;font-size:13px;">＋ 昼食の組み合わせを追加</button>
  <label>間食</label>
  <div id="snackContainer"></div>
  <button type="button" class="btn-add-snack" onclick="addSnackRow()">＋ 間食を追加</button>
  <label>変動要因 (ノイズの記録)</label>
  <div class="checkbox-group grid" style="margin-bottom:5px;">
    <label><input type="checkbox" id="tagHoliday"><span class="tag-info">休日(祝休・有休)</span></label>
    <label><input type="checkbox" id="tagNoBM"><span class="tag-warn">便通なし</span></label>
    <label><input type="checkbox" id="tagLunchOut"><span class="tag-warn">昼外食</span></label>
    <label><input type="checkbox" id="tagDinnerOut"><span class="tag-warn">夜外食</span></label>
    <label><input type="checkbox" id="tagAlcohol"><span class="tag-warn">飲酒</span></label>
    <label><input type="checkbox" id="tagSalty"><span class="tag-warn">塩分多め</span></label>
    <label><input type="checkbox" id="tagWorkStress"><span class="tag-warn">残業/ストレス</span></label>
    <label><input type="checkbox" id="tagMusclePain"><span class="tag-warn">筋肉痛/疲労</span></label>
  </div>
  <label>メモ(任意)</label><input type="text" id="memoInput" placeholder="例: 食べすぎた等">
  
  <button type="button" class="btn-save-sub" onclick="saveData(false)">記録を更新 (都度保存)</button>
  <div id="quickSaveToast"></div>
  <button type="button" class="btn-save-main" onclick="saveData(true)">本日の記録を完了して総合分析</button>
</div>

<div class="card">
  <h2>データ分析</h2>
  <canvas id="weightChart"></canvas>
  <button class="btn-zoom" onclick="document.getElementById('chartModal').classList.remove('hidden')">グラフを全画面で拡大表示</button>
  <div class="btn-group" style="margin-top:15px;"><button id="btn1w" onclick="drawChart(7)">1週間</button><button id="btn1m" onclick="drawChart(30)">1ヶ月</button><button id="btn6m" onclick="drawChart(180)">半年</button></div>
  <div class="row" style="margin-top:15px;">
    <button class="btn-export" onclick="copyForAI()">データコピー</button>
    <button class="btn-export" style="background:#28a745;" onclick="downloadCSV()">CSV保存</button>
  </div>
</div>

<div class="card">
  <h2>過去の記録</h2>
  <div id="summaryContainer"></div><div id="historyContainer"></div>
</div>

<div id="chartModal" class="hidden">
  <div class="modal-content">
    <span class="close-btn" onclick="document.getElementById('chartModal').classList.add('hidden')">×</span>
    <h3 style="margin-top:0;font-size:16px;">拡大グラフ</h3>
    <canvas id="modalCanvas"></canvas>
  </div>
</div>

<script>
  var GOAL_KM = 100;
  var $ = function(id) { return document.getElementById(id); };
  var lm = {'bento':'弁当','onigiri_low':'おにぎり(低)','onigiri_high':'おにぎり(高)','bread':'パン','other':'その他'};
  var md = {'great':'◎','good':'○','soso':'△','bad':'✕'};
  
  function getL(t, c, m) {
    if (!t) return '';
    if (t === 'other') return 'その他(' + (m || '') + ')';
    if (t === 'bento') return '弁当';
    return (lm[t] || '') + (c || 0) + '個';
  }
  
  function fmtDate(d) {
    if (!(d instanceof Date) || isNaN(d)) return '';
    var year = d.getFullYear();
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return year + '-' + month + '-' + day;
  }

  $('exRun').addEventListener('change', function() {
    $('runDistWrapper').classList.toggle('hidden', !$('exRun').checked);
  });
  
  document.querySelectorAll('#exRun,#exMuscleUpper,#exMuscleLower,#exStretch').forEach(function(el) {
    el.addEventListener('change', function(e) {
      if (e.target.checked) $('exNone').checked = false;
    });
  });
  
  $('exNone').addEventListener('change', function(e) {
    if (e.target.checked) {
      $('exRun').checked = false;
      $('exMuscleUpper').checked = false;
      $('exMuscleLower').checked = false;
      $('exStretch').checked = false;
      $('runDistWrapper').classList.add('hidden');
    }
  });
  
  $('lunchSelect').addEventListener('change', function(e) {
    var o = e.target.value === 'other';
    $('lunchCount').classList.toggle('hidden', o || e.target.value === 'bento');
    $('lunchMemo').classList.toggle('hidden', !o);
  });
  
  $('lunchSelect2').addEventListener('change', function(e) {
    var o = e.target.value === 'other';
    $('lunchCount2').classList.toggle('hidden', o || ['bento', ''].includes(e.target.value));
    $('lunchMemo2').classList.toggle('hidden', !o);
  });
  
  $('btnAddLunch').addEventListener('click', function() {
    $('lunchRow2').classList.remove('hidden');
    $('btnAddLunch').style.display = 'none';
  });

  function addSnackRow(time, cal, content) {
    time = time || '';
    cal = cal || '';
    content = content || '';
    var div = document.createElement('div');
    div.className = 'snack-item';
    div.innerHTML = '<div class="row" style="margin-bottom:8px;">' +
      '<select class="snack-time" style="flex:2;">' +
      '<option value="">タイミング</option>' +
      '<option value="morning"' + (time === 'morning' ? ' selected' : '') + '>朝</option>' +
      '<option value="noon"' + (time === 'noon' ? ' selected' : '') + '>昼</option>' +
      '<option value="evening"' + (time === 'evening' ? ' selected' : '') + '>夕方</option>' +
      '<option value="before_dinner"' + (time === 'before_dinner' ? ' selected' : '') + '>夕食前</option>' +
      '<option value="after_dinner"' + (time === 'after_dinner' ? ' selected' : '') + '>夕食後</option>' +
      '</select>' +
      '<input type="number" class="snack-cal" style="flex:2;" min="0" placeholder="kcal" value="' + cal + '">' +
      '<button type="button" class="btn-remove-snack" style="flex:0.6;" onclick="this.parentElement.parentElement.remove()">X</button>' +
      '</div>' +
      '<input type="text" class="snack-content" placeholder="内容 (例: チョコ)" value="' + content + '">';
    $('snackContainer').appendChild(div);
  }

  function getSafeData() {
    try {
      var v = localStorage.getItem('myHealthData');
      if (!v) return {};
      var raw = JSON.parse(v);
      var fixed = {};
      var changed = false;
      Object.keys(raw).forEach(function(k) {
        var newK = k.replace(/\//g, '-');
        var m = newK.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (m) newK = m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
        fixed[newK] = raw[k];
        if (k !== newK) changed = true;
      });
      if (changed) localStorage.setItem('myHealthData', JSON.stringify(fixed));
      return fixed;
    } catch(e) {
      return {};
    }
  }

  function showMultiFeedback(currentDate, r) {
    var b = $('feedbackBanner');
    b.classList.remove('hidden');

    var burn = 0;
    if (r.run && r.runKm) burn += Math.round(r.weight * r.runKm);
    if (r.muscleUpper || r.muscle) burn += 100;
    if (r.muscleLower) burn += 100;
    if (r.stretch) burn += 30;

    var eat = 0;
    var hasLateSnack = false;
    var snackCount = 0;
    if (Array.isArray(r.snacks)) {
      r.snacks.forEach(function(s) {
        var c = parseInt(s.cal) || 0;
        eat += c;
        if (s.time === 'after_dinner') hasLateSnack = true;
        if (c > 0 || (s.content && s.content.trim())) snackCount++;
      });
    }

    var net = eat - burn;
    var hasNoise = r.lunchOut || r.dinnerOut || r.alcohol || r.salty || r.noBM;

    // 前日比の計算
    var raw = getSafeData();
    var cParts = currentDate.split('-');
    var prevDiff = null;
    if (cParts.length === 3) {
      var cObj = new Date(parseInt(cParts[0],10), parseInt(cParts[1],10)-1, parseInt(cParts[2],10));
      cObj.setDate(cObj.getDate() - 1);
      var prevDateStr = fmtDate(cObj);
      if (raw[prevDateStr] && raw[prevDateStr].weight && r.weight) {
        prevDiff = Math.round((r.weight - raw[prevDateStr].weight) * 10) / 10;
      }
    }

    // 月間進捗ペース
    var today = new Date();
    var curDay = today.getDate();
    var totalDays = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    var mRun = 0;
    Object.keys(raw).forEach(function(d) {
      var dParts = d.split('-');
      if (dParts.length === 3 && (parseInt(dParts[1],10) - 1) === today.getMonth()) {
        if (raw[d].run) mRun += (raw[d].runKm || 0);
      }
    });
    var expectedKm = (GOAL_KM / totalDays) * curDay;
    var paceAhead = mRun >= expectedKm;

    // レイヤー1：運動収支・行動実績
    var l1 = "";
    if (r.run && net <= -200 && !hasNoise) {
      l1 = "完璧な立ち回りです。無駄なノイズを遮断し、純粋に脂肪燃焼へ直結させた見事な1日でした。";
    } else if (r.run && net <= 0) {
      l1 = "しっかり走って消費を先行させました。日々の確実な積み重ねが身体を絞り込みます。";
    } else if (!r.run && (r.muscleUpper || r.muscleLower || r.stretch)) {
      l1 = "ランオフでも補強トレで代謝ベースを維持できています。地道な補強が走りの粘りを生みます。";
    } else if (net > 200) {
      l1 = "本日は間食が運動消費を明確に上回りました。明日の食事配分ですぐに手当を入れましょう。";
    } else if (hasNoise) {
      l1 = "複数のノイズが重なりました。明朝の数値が上振れても慌てず、平常運転で水分を抜きましょう。";
    } else {
      l1 = "1日の記録が完了しました。現状を正確に把握できていること自体が次への前進です。";
    }

    // レイヤー2：間食の質・前日比
    var l2 = "";
    if (hasLateSnack) {
      l2 = "夕食以降の間食を検知しました。就寝中の内臓負担を抑え、脂肪代謝を促すためにも夜は引き締めたい局面です。";
    } else if (snackCount > 0 && eat <= 150) {
      l2 = "間食を低カロリー・コンパクトに制御できています。食べる量を理性でコントロールできています。";
    } else if (prevDiff !== null && prevDiff >= 0.4) {
      l2 = "前日から+0.4kg以上の増加です。ノイズによる水分滞留か、実質的な過剰かを見極めて冷静に対処しましょう。";
    } else if (prevDiff !== null && prevDiff <= -0.3) {
      l2 = "前日比でしっかり絞れています。日頃の節制とトレーニングの成果が着実に現れています。";
    }

    // レイヤー3：月間目標ペース・調子
    var l3 = "";
    if (r.mood === 'bad') {
      l3 = "しんどい状況でも記録を途絶えさせなかったことが最大の収穫です。今夜は休養を最優先に。";
    } else if (r.mood === 'great') {
      l3 = "調子の良さが行動に直結しています。この良い感覚とリズムを身体に記憶させておきましょう。";
    } else if (paceAhead) {
      l3 = "月間100kmに対してペース先行をキープ中。疲労を抜きつつ確固たる土台を固めていきましょう。";
    } else {
      l3 = "月間目標に対して走行距離がやや不足気味です。次のポイント練習でまとまった距離を稼ぎたいところです。";
    }

    var lines = [l1];
    if (l2) lines.push(l2);
    if (l3) lines.push(l3);
    b.innerHTML = lines.join('<br>');
  }

  function loadDataForDate() {
    var d = $('dateInput').value;
    if (!d) return;
    var raw = getSafeData();
    var rd = raw[d] || {};
    $('weightInput').value = rd.weight || '';
    if (rd.mood) {
      var mEl = document.querySelector('input[name="mood"][value="' + rd.mood + '"]');
      if (mEl) mEl.checked = true;
    } else {
      document.querySelectorAll('input[name="mood"]').forEach(function(el) { el.checked = false; });
    }
    $('exRun').checked = rd.run || false;
    $('runDistInput').value = rd.runKm || '';
    $('exMuscleUpper').checked = rd.muscleUpper || rd.muscle || false;
    $('exMuscleLower').checked = rd.muscleLower || false;
    $('exStretch').checked = rd.stretch || false;
    $('exNone').checked = (rd.weight && !rd.run && !rd.muscleUpper && !rd.muscleLower && !rd.stretch && !rd.muscle) ? true : false;
    
    var lt = rd.lunchType || rd.lunch || 'bento';
    if (lt === 'onigiri') lt = 'onigiri_low';
    $('lunchSelect').value = lt;
    $('lunchCount').value = rd.lunchCount || '';
    $('lunchMemo').value = rd.lunchMemo || '';
    $('lunchSelect').dispatchEvent(new Event('change'));
    
    if (rd.lunchType2) {
      $('lunchRow2').classList.remove('hidden');
      $('btnAddLunch').style.display = 'none';
      $('lunchSelect2').value = rd.lunchType2;
      $('lunchCount2').value = rd.lunchCount2 || '';
      $('lunchMemo2').value = rd.lunchMemo2 || '';
    } else {
      $('lunchRow2').classList.add('hidden');
      $('btnAddLunch').style.display = 'block';
      $('lunchSelect2').value = '';
      $('lunchCount2').value = '';
      $('lunchMemo2').value = '';
    }
    $('lunchSelect2').dispatchEvent(new Event('change'));

    $('snackContainer').innerHTML = '';
    if (Array.isArray(rd.snacks)) {
      rd.snacks.forEach(function(s) { addSnackRow(s.time, s.cal, s.content); });
    }
    
    $('tagHoliday').checked = rd.holiday || false;
    $('tagLunchOut').checked = rd.lunchOut || false;
    $('tagDinnerOut').checked = rd.dinnerOut || false;
    $('tagAlcohol').checked = rd.alcohol || false;
    $('tagSalty').checked = rd.salty || false;
    $('tagNoBM').checked = rd.noBM || false;
    $('tagWorkStress').checked = rd.workStress || false;
    $('tagMusclePain').checked = rd.musclePain || false;
    $('memoInput').value = rd.memo || '';
    $('exRun').dispatchEvent(new Event('change'));
    $('feedbackBanner').classList.add('hidden');
    $('quickSaveToast').innerText = '';
  }
  
  $('dateInput').addEventListener('change', loadDataForDate);

  function saveData(isFinalAnalyze) {
    var d = $('dateInput').value;
    var w = $('weightInput').value;
    if (!d || !w) return alert('日付と体重は必須です');
    var snacks = [];
    document.querySelectorAll('.snack-item').forEach(function(i) {
      var t = i.querySelector('.snack-time').value;
      var c = i.querySelector('.snack-cal').value;
      var txt = i.querySelector('.snack-content').value;
      if (t || c || txt) snacks.push({ time: t, cal: c ? parseInt(c) : 0, content: txt });
    });
    var moodEl = document.querySelector('input[name="mood"]:checked');
    var moodVal = moodEl ? moodEl.value : '';
    var data = getSafeData();
    var newData = {
      weight: parseFloat(w),
      mood: moodVal,
      run: $('exRun').checked,
      runKm: $('exRun').checked ? parseFloat($('runDistInput').value || 0) : 0,
      muscleUpper: $('exMuscleUpper').checked,
      muscleLower: $('exMuscleLower').checked,
      stretch: $('exStretch').checked,
      lunchType: $('lunchSelect').value,
      lunchCount: parseInt($('lunchCount').value || 0),
      lunchMemo: $('lunchMemo').value,
      lunchType2: $('lunchRow2').classList.contains('hidden') ? '' : $('lunchSelect2').value,
      lunchCount2: parseInt($('lunchCount2').value || 0),
      lunchMemo2: $('lunchMemo2').value,
      snacks: snacks,
      holiday: $('tagHoliday').checked,
      lunchOut: $('tagLunchOut').checked,
      dinnerOut: $('tagDinnerOut').checked,
      alcohol: $('tagAlcohol').checked,
      salty: $('tagSalty').checked,
      noBM: $('tagNoBM').checked,
      workStress: $('tagWorkStress').checked,
      musclePain: $('tagMusclePain').checked,
      memo: $('memoInput').value
    };
    data[d] = Object.assign(data[d] || {}, newData);
    localStorage.setItem('myHealthData', JSON.stringify(data));
    
    drawChart(30);
    updateHistoryList();

    if (isFinalAnalyze) {
      showMultiFeedback(d, newData);
      $('quickSaveToast').innerText = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      $('feedbackBanner').classList.add('hidden');
      var now = new Date();
      var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      var toast = $('quickSaveToast');
      toast.innerText = '保存完了 (' + timeStr + ')';
      setTimeout(function() {
        if (toast.innerText.indexOf('保存完了') !== -1) toast.innerText = '';
      }, 3500);
    }
  }

  function updateHistoryList() {
    var raw = getSafeData();
    var dates = Object.keys(raw).sort(function(a, b) { return b.localeCompare(a); });
    if (!dates.length) {
      $('summaryContainer').innerHTML = 'データなし';
      $('historyContainer').innerHTML = '<p>記録がありません</p>';
      $('streakBadge').innerHTML = '記録なし';
      return;
    }
    
    var streak = 0;
    var today = new Date();
    for (var i = 0; i < 365; i++) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var ds = fmtDate(d);
      if (raw[ds] && raw[ds].weight) streak++;
      else if (i > 0) break;
    }
    $('streakBadge').innerHTML = streak > 0 ? ('連続記録：' + streak + '日目') : '記録なし';

    var mRun = 0, mBurn = 0, mEat = 0;
    var currMonth = today.getMonth();
    
    dates.forEach(function(d) {
      var rd = raw[d];
      if (!rd || typeof rd !== 'object') return;
      var dParts = d.split('-');
      if (dParts.length !== 3) return;
      var dMonth = parseInt(dParts[1], 10) - 1;
      if (rd.weight && dMonth === currMonth) {
        if (rd.run) mRun += (rd.runKm || 0);
        var burn = 0;
        if (rd.run) burn += Math.round(rd.weight * rd.runKm);
        if (rd.muscleUpper || rd.muscle) burn += 100;
        if (rd.muscleLower) burn += 100;
        if (rd.stretch) burn += 30;
        mBurn += burn;
        if (Array.isArray(rd.snacks)) {
          rd.snacks.forEach(function(s) { mEat += (parseInt(s.cal) || 0); });
        }
      }
    });
    
    var progPct = Math.min(100, (mRun / GOAL_KM) * 100);
    var mNet = mEat - mBurn;
    var mFat = Math.round(Math.abs(mNet) / 7.2);
    var fatHtml = mNet <= 0 ? 
      '<span style="color:#28a745">約' + mFat + 'gの脂肪燃焼ペース</span>' : 
      '<span style="color:#dc3545">約' + mFat + 'gの脂肪余剰ペース</span>';
    
    $('summaryContainer').innerHTML = '<div style="text-align:left;">' +
      '<div style="font-size:13px;color:#666;font-weight:bold;margin-bottom:4px;">月間走行距離: ' + mRun.toFixed(1) + ' / ' + GOAL_KM + 'km</div>' +
      '<div class="prog-bg"><div class="prog-bar" style="width:' + progPct + '%"></div></div>' +
      '<div style="font-size:13px;color:#666;font-weight:bold;margin-top:10px;">今月の正味カロリー: ' + (mNet > 0 ? '+' : '') + mNet + 'kcal</div>' +
      '<div style="font-size:15px;margin-top:2px;">' + fatHtml + '</div></div>';
    
    var html = '';
    var tm = { 'morning': '朝', 'noon': '昼', 'evening': '夕方', 'before_dinner': '夕食前', 'after_dinner': '夕食後' };
    dates.forEach(function(d) {
      var r = raw[d];
      if (!r || !r.weight) return;
      var burn = 0;
      if (r.run && r.runKm) burn += Math.round(r.weight * r.runKm);
      if (r.muscleUpper || r.muscle) burn += 100;
      if (r.muscleLower) burn += 100;
      if (r.stretch) burn += 30;
      var eat = 0;
      if (Array.isArray(r.snacks)) {
        r.snacks.forEach(function(s) { eat += (parseInt(s.cal) || 0); });
      }
      
      var net = eat - burn;
      var balHtml = net <= 0 ? 
        '<div class="bal-box bal-good">間食' + eat + ' - 消費' + burn + ' = ' + net + 'kcal</div>' : 
        '<div class="bal-box bal-over">間食' + eat + ' - 消費' + burn + ' = +' + net + 'kcal</div>';

      var isPerfect = r.run && (net <= 0) && !r.lunchOut && !r.dinnerOut && !r.alcohol && !r.salty;
      var perfHtml = isPerfect ? '<span style="background:linear-gradient(45deg, #ffd700, #ffa500);color:#fff;font-size:11px;padding:2px 8px;border-radius:12px;margin-left:8px;font-weight:bold;">PERFECT</span>' : '';

      var ex = [];
      if (r.run) ex.push('ラン' + r.runKm + 'km');
      if (r.muscleUpper || r.muscle) ex.push('筋(上)');
      if (r.muscleLower) ex.push('筋(下)');
      if (r.stretch) ex.push('ストレッチ');
      
      var lType = r.lunchType || r.lunch || '';
      var lTxt = getL(lType, r.lunchCount, r.lunchMemo);
      if (r.lunchType2) lTxt += ' ＋ ' + getL(r.lunchType2, r.lunchCount2, r.lunchMemo2);
      
      var sTxt = (Array.isArray(r.snacks) && r.snacks.length) ? r.snacks.map(function(s) {
        return (tm[s.time] || '') + ' ' + s.content + '(' + (s.cal ? s.cal + 'kcal' : '') + ')';
      }).join(', ') : 'なし';
      
      var tgs = [];
      if (r.holiday) tgs.push("休日");
      if (r.lunchOut) tgs.push("昼外食");
      if (r.dinnerOut) tgs.push("夜外食");
      if (r.alcohol) tgs.push("飲酒");
      if (r.salty) tgs.push("塩分多め");
      if (r.noBM) tgs.push("便通なし");
      if (r.workStress) tgs.push("残業/ストレス");
      if (r.musclePain) tgs.push("筋肉痛/疲労");
      
      var moodLabel = md[r.mood] || r.mood || '';
      var moodTxt = moodLabel ? '<span style="display:inline-block;width:24px;text-align:center;font-weight:bold;margin-right:6px;color:#0284c7;">' + moodLabel + '</span>' : '';

      html += '<div style="border-bottom:1px solid #f0f2f5;padding:16px 0;">' +
        '<div style="display:flex;align-items:center;margin-bottom:6px;">' + moodTxt + '<span style="font-weight:bold;color:#4facfe;font-size:16px;">' + d + ' : ' + r.weight + 'kg</span>' + perfHtml + '</div>' +
        balHtml +
        '<div style="color:#666;line-height:1.6;margin-top:8px;font-size:13px;">運動: ' + (ex.length ? ex.join(', ') : 'なし') + ' | 昼食: ' + lTxt + '<br>間食: ' + sTxt + '<br>要因: ' + (tgs.length ? tgs.join('・') : 'なし') + (r.memo ? '<br>メモ: ' + r.memo : '') + '</div></div>';
    });
    $('historyContainer').innerHTML = html;
  }

  function getCSVData() {
    var raw = getSafeData();
    var dates = Object.keys(raw).sort();
    if (!dates.length) return null;
    var csv = "日付(曜日),平日/休日,調子,体重,運動,運動消費(kcal),昼食,間食,間食摂取(kcal),差分(間食-消費kcal),外食飲酒等,体調・疲労,メモ\n";
    var tm = { 'morning': '朝', 'noon': '昼', 'evening': '夕方', 'before_dinner': '夕食前', 'after_dinner': '夕食後' };
    var dw = ['日', '月', '火', '水', '木', '金', '土'];
    dates.forEach(function(d) {
      var r = raw[d];
      var ex = [];
      var burn = 0;
      var dParts = d.split('-');
      var dayStr = '';
      if (dParts.length === 3) {
        var dObj = new Date(parseInt(dParts[0], 10), parseInt(dParts[1], 10) - 1, parseInt(dParts[2], 10));
        if (!isNaN(dObj)) dayStr = dw[dObj.getDay()];
      }
      if (r.run) { ex.push('ラン' + r.runKm + 'km'); burn += Math.round(r.weight * r.runKm); }
      if (r.muscleUpper || r.muscle) { ex.push('筋(上)'); burn += 100; }
      if (r.muscleLower) { ex.push('筋(下)'); burn += 100; }
      if (r.stretch) { ex.push('ストレッチ'); burn += 30; }
      
      var eat = 0;
      var sTxt = (Array.isArray(r.snacks) && r.snacks.length) ? r.snacks.map(function(s) {
        eat += (parseInt(s.cal) || 0);
        return (tm[s.time] || s.time) + ':' + s.content + '(' + s.cal + 'kcal)';
      }).join(' / ') : 'なし';
      
      var lType = r.lunchType || r.lunch || '';
      var lTxt = getL(lType, r.lunchCount, r.lunchMemo);
      if (r.lunchType2) lTxt += ' ＋ ' + getL(r.lunchType2, r.lunchCount2, r.lunchMemo2);
      
      var tgs = [];
      if (r.lunchOut) tgs.push("昼外");
      if (r.dinnerOut) tgs.push("夜外");
      if (r.alcohol) tgs.push("飲酒");
      if (r.salty) tgs.push("塩分多め");
      
      var cond = [];
      if (r.noBM) cond.push("便通なし");
      if (r.workStress) cond.push("残業/ストレス");
      if (r.musclePain) cond.push("筋肉痛/疲労");
      
      var moodLabel = md[r.mood] || r.mood || '';
      csv += d + '(' + dayStr + '),' + (r.holiday ? '休日' : '平日') + ',' + moodLabel + ',' + r.weight + ',' + (ex.length ? ex.join('+') : '休') + ',' + burn + ',' + lTxt + ',' + sTxt + ',' + eat + ',' + (eat - burn) + ',' + (tgs.length ? tgs.join('・') : '無') + ',' + (cond.length ? cond.join('・') : '通常') + ',' + (r.memo || '') + '\n';
    });
    return csv;
  }

  function copyForAI() {
    var csv = getCSVData();
    if (!csv) return alert('データがありません');
    navigator.clipboard.writeText(csv).then(function() { alert("コピーしました！"); }).catch(function() { alert("コピー失敗"); });
  }

  function downloadCSV() {
    var csv = getCSVData();
    if (!csv) return alert('データがありません');
    var blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "health_data.csv";
    link.click();
  }

  var chartInstance = null;
  var modalChartInstance = null;

  function drawChart(days) {
    ['btn1w', 'btn1m', 'btn6m'].forEach(function(id) { document.getElementById(id).classList.remove('active'); });
    document.getElementById(days === 7 ? 'btn1w' : days === 30 ? 'btn1m' : 'btn6m').classList.add('active');
    var raw = getSafeData();
    var labels = [], w = [], cols = [], mAvgs = [], today = new Date();
    for (var i = days - 1; i >= 0; i--) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var ds = fmtDate(d);
      labels.push(ds.slice(5).replace('-', '/'));
      var rd = raw[ds];
      if (rd && rd.weight) {
        w.push(rd.weight);
        cols.push(rd.lunchOut || rd.dinnerOut || rd.alcohol || rd.salty || rd.noBM || rd.workStress || rd.musclePain ? 'rgba(220,53,69,1)' : (rd.run || rd.muscleUpper || rd.muscleLower || rd.muscle ? 'rgba(40,167,69,1)' : 'rgba(79,172,254,1)'));
      } else {
        w.push(null);
        cols.push('rgba(79,172,254,1)');
      }
      var s = 0, c = 0;
      for (var j = 0; j < 7; j++) {
        var pd = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (i + j));
        var pds = fmtDate(pd);
        if (raw[pds] && raw[pds].weight) { s += raw[pds].weight; c++; }
      }
      mAvgs.push(c > 0 ? (s / c).toFixed(2) : null);
    }
    
    if (typeof Chart === 'undefined') return;

    var getChartConfig = function() {
      return {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: '7日平均', data: mAvgs, borderColor: 'rgba(255,193,7,0.8)', backgroundColor: 'transparent', borderWidth: 3, pointRadius: 0, spanGaps: true, tension: 0.4, order: 1 },
            { label: '体重(kg)', data: w, borderColor: 'rgba(79,172,254,0.3)', backgroundColor: 'transparent', pointBackgroundColor: cols, pointBorderColor: cols, borderWidth: 2, pointRadius: 5, spanGaps: true, tension: 0.2, order: 2 }
          ]
        },
        options: {
          responsive: true,
          scales: { x: { grid: { display: false } }, y: { grace: '10%', grid: { color: '#f0f2f5' } } },
          plugins: {
            legend: { display: true },
            tooltip: {
              callbacks: {
                afterLabel: function(ctx) {
                  if (ctx.datasetIndex === 0) return;
                  var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (days - 1) + ctx.dataIndex);
                  var rd = raw[fmtDate(d)];
                  if (!rd) return [];
                  var dtls = [];
                  var tm = { 'morning': '朝', 'noon': '昼', 'evening': '夕方', 'before_dinner': '夕食前', 'after_dinner': '夕食後' };
                  var lType = rd.lunchType || rd.lunch || '';
                  var lTxt = getL(lType, rd.lunchCount, rd.lunchMemo);
                  if (rd.lunchType2) lTxt += ' ＋ ' + getL(rd.lunchType2, rd.lunchCount2, rd.lunchMemo2);
                  dtls.push('昼食: ' + lTxt);
                  var tgs = [];
                  if (rd.holiday) tgs.push("休日");
                  if (rd.lunchOut) tgs.push("昼外食");
                  if (rd.dinnerOut) tgs.push("夜外食");
                  if (rd.alcohol) tgs.push("飲酒");
                  if (rd.salty) tgs.push("塩分多め");
                  if (rd.noBM) tgs.push("便通なし");
                  if (rd.workStress) tgs.push("残業/ストレス");
                  if (rd.musclePain) tgs.push("筋肉痛/疲労");
                  if (tgs.length) dtls.push('要因: ' + tgs.join(', '));
                  if (Array.isArray(rd.snacks)) {
                    rd.snacks.forEach(function(s, idx) {
                      dtls.push('間食' + (idx + 1) + ': ' + (tm[s.time] || '') + ' ' + s.content + ' (' + s.cal + 'kcal)');
                    });
                  }
                  if (rd.mood) dtls.push('調子: ' + (md[rd.mood] || rd.mood || ''));
                  if (rd.memo) dtls.push('メモ: ' + rd.memo);
                  return dtls;
                }
              }
            }
          }
        }
      };
    };

    var ctx = document.getElementById('weightChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, getChartConfig());
    
    var mCtx = document.getElementById('modalCanvas').getContext('2d');
    if (modalChartInstance) modalChartInstance.destroy();
    modalChartInstance = new Chart(mCtx, getChartConfig());
  }

  $('dateInput').value = fmtDate(new Date());
  loadDataForDate();
  updateHistoryList();
  drawChart(30);
</script>
</body>
</html>
