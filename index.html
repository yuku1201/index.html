<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>体重・運動記録</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:'Helvetica Neue',Arial,sans-serif;padding:15px;margin:0;background:#f7f9fa;color:#444}
.card{background:#fff;padding:24px;border-radius:20px;margin-bottom:20px;box-shadow:0 8px 16px rgba(0,0,0,0.04)}
h2{font-size:1.25em;margin-top:0;border-bottom:2px solid #f0f2f5;padding-bottom:12px;display:flex;justify-content:space-between;align-items:center;color:#333}
label{display:block;margin:16px 0 8px;font-weight:bold;font-size:14px;color:#555}
input[type="number"],input[type="text"],input[type="date"],select{width:100%;padding:14px;box-sizing:border-box;border:2px solid #e1e5e8;border-radius:12px;font-size:16px;background:#fafbfc;transition:0.2s}
input:focus,select:focus{border-color:#4facfe;outline:none;background:#fff}
.row{display:flex;gap:10px;margin-bottom:8px}.row > *{flex:1}
.checkbox-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.checkbox-group label{display:inline-flex;align-items:center;background:#f0f4f8;padding:12px 16px;border-radius:30px;font-weight:normal;margin:0;cursor:pointer;transition:0.2s;border:2px solid transparent;font-size:14px}
.checkbox-group input:checked + span{font-weight:bold}
.checkbox-group label:has(input:checked){border-color:currentColor;background:#fff}
.checkbox-group label:has(input:checked) .tag-ex{color:#28a745}
.checkbox-group label:has(input:checked:is(#exRun,#exMuscleUpper,#exMuscleLower,#exStretch)){border-color:#28a745;background:#f2fcf5}
.checkbox-group label:has(input:checked) .tag-rest{color:#6c757d}
.checkbox-group label:has(input:checked#exNone){border-color:#6c757d;background:#f8f9fa}
.checkbox-group.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.checkbox-group.grid label{justify-content:center;padding:12px 4px;border-radius:12px;text-align:center;}
.checkbox-group label:has(input:checked) .tag-warn{color:#dc3545}
.checkbox-group label:has(input:checked:is(#tagLunchOut,#tagDinnerOut,#tagAlcohol,#tagSalty,#tagNoBM,#tagWorkStress,#tagMusclePain)){border-color:#dc3545;background:#fff5f5}
.checkbox-group label:has(input:checked) .tag-info{color:#17a2b8}
.checkbox-group label:has(input:checked#tagHoliday){border-color:#17a2b8;background:#f0f9fa}
.checkbox-group input{display:none}.hidden{display:none !important}
.mood-group{display:flex;gap:10px;margin-bottom:15px}
.mood-group label{flex:1;text-align:center;background:#f0f4f8;padding:15px 5px;border-radius:16px;cursor:pointer;border:2px solid transparent;transition:0.2s;font-size:15px}
.mood-group label:has(input:checked){background:#fff8e1;border-color:#ffc107;font-weight:bold;transform:scale(1.02);box-shadow:0 4px 8px rgba(255,193,7,0.2)}
.mood-group input{display:none}
.snack-item{background:#f8f9fa;padding:16px;border-radius:16px;margin-bottom:12px;border:1px solid #e1e5e8;}
.btn-remove-snack{background:#ffe5e5;color:#dc3545;border:none;border-radius:10px;font-weight:bold;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
.btn-add-snack{background:transparent;color:#4facfe;border:2px dashed #4facfe;padding:14px;border-radius:12px;cursor:pointer;width:100%;font-weight:bold;margin-bottom:10px;font-size:15px;}
.btn-save{background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);color:#fff;border:none;padding:16px;width:100%;border-radius:16px;font-size:18px;font-weight:bold;margin-top:15px;cursor:pointer;box-shadow:0 6px 12px rgba(79,172,254,0.3);transition:0.2s}
.btn-save:active{transform:translateY(2px);box-shadow:0 2px 6px rgba(79,172,254,0.3)}
.btn-export{background:#495057;color:#fff;border:none;padding:12px;border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer;}
.btn-zoom{background:#f0f4f8;color:#555;border:none;padding:10px;border-radius:12px;font-size:14px;cursor:pointer;width:100%;margin-top:10px;font-weight:bold}
.btn-group{display:flex;gap:8px;margin-bottom:15px}.btn-group button{flex:1;background:#f0f4f8;border:none;padding:12px;border-radius:12px;font-size:14px;color:#555;font-weight:bold}.btn-group button.active{background:#4facfe;color:#fff}
#historyContainer{max-height:450px;overflow-y:auto;font-size:14px;padding-right:5px}
#summaryContainer{background:#fff;padding:16px;border-radius:16px;margin-bottom:20px;color:#333;border:2px solid #e8f0f6;line-height:1.6}
#feedbackBanner{background:#e8f4fd;color:#0056b3;padding:16px;border-radius:16px;margin-bottom:20px;font-weight:bold;text-align:center;line-height:1.5;box-shadow:0 4px 8px rgba(0,86,179,0.05);border:1px solid #cce5ff}
.bal-box{display:inline-block;padding:4px 10px;border-radius:8px;font-size:13px;margin-top:4px;font-weight:bold}
.bal-plus{background:#e6f4ea;color:#137333;}
.bal-minus{background:#fce8e6;color:#c5221f;}
.prog-bg{background:#e1e5e8;border-radius:10px;height:14px;width:100%;margin:8px 0;overflow:hidden;}
.prog-bar{background:linear-gradient(90deg, #4facfe, #00f2fe);height:100%;transition:width 0.4s ease-out;}
#streakBadge{font-size:13px;background:linear-gradient(135deg, #f6d365 0%, #fda085 100%);color:#fff;padding:6px 12px;border-radius:20px;font-weight:bold;box-shadow:0 2px 6px rgba(253,160,133,0.3);cursor:pointer;}
#chartModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;box-sizing:border-box}
.modal-content{background:#fff;width:100%;border-radius:20px;padding:24px;box-sizing:border-box;position:relative}
.close-btn{position:absolute;top:10px;right:20px;font-size:28px;cursor:pointer;font-weight:bold;color:#999}
</style></head>
<body>
<div class="card">
  <h2>記録・修正 <span id="streakBadge" onclick="alert('【連続記録ストリーク】\nカロリーの赤字・黒字に関わらず、ごまかさずに体重と食事を記録し続けた連続日数です。')">記録なし</span></h2>
  <div id="feedbackBanner" class="hidden"></div>
  <label>日付</label><input type="date" id="dateInput">
  <label>体重 (kg)</label><input type="number" step="0.1" id="weightInput" placeholder="例: 65.5">
  <label>今日の気分</label>
  <div class="mood-group">
    <label><input type="radio" name="mood" value="good"><span>😄 最高！</span></label>
    <label><input type="radio" name="mood" value="soso"><span>🙂 まあまあ</span></label>
    <label><input type="radio" name="mood" value="bad"><span>😣 耐えた…</span></label>
  </div>
  <label>運動</label>
  <div class="checkbox-group">
    <label><input type="checkbox" id="exRun" value="run"><span class="tag-ex">ラン</span></label>
    <label><input type="checkbox" id="exMuscleUpper" value="upper"><span class="tag-ex">上半身/体幹</span></label>
    <label><input type="checkbox" id="exMuscleLower" value="lower"><span class="tag-ex">下半身</span></label>
    <label><input type="checkbox" id="exStretch" value="stretch"><span class="tag-ex">ストレッチ</span></label>
    <label><input type="checkbox" id="exNone" value="none"><span class="tag-rest">休養</span></label>
  </div>
  <div id="runDistWrapper" class="hidden"><label>距離(km)</label><input type="number" step="0.1" id="runDistInput" placeholder="例: 10"></div>
  <label>昼食</label>
  <div class="row" style="margin-bottom:5px;">
    <select id="lunchSelect"><option value="bento">弁当(持参)</option><option value="onigiri_low">おにぎり(低脂質)</option><option value="onigiri_high">おにぎり(高脂質)</option><option value="bread">パン</option><option value="other">その他</option></select>
    <input type="number" id="lunchCount" min="0" placeholder="個数(例:2)"><input type="text" id="lunchMemo" class="hidden" placeholder="内容(例:パスタ)">
  </div>
  <div class="row hidden" id="lunchRow2" style="margin-bottom:5px;">
    <select id="lunchSelect2"><option value="">-- 追加なし --</option><option value="bento">弁当(持参)</option><option value="onigiri_low">おにぎり(低脂質)</option><option value="onigiri_high">おにぎり(高脂質)</option><option value="bread">パン</option><option value="other">その他</option></select>
    <input type="number" id="lunchCount2" min="0" placeholder="個数"><input type="text" id="lunchMemo2" class="hidden" placeholder="内容">
  </div>
  <button type="button" id="btnAddLunch" class="btn-add-snack" style="border-width:1px;padding:8px;margin-bottom:15px;color:#6c757d;border-color:#ced4da;font-size:13px;">＋ 昼食の組み合わせを追加</button>
  <label>間食</label>
  <div id="snackContainer"></div>
  <button type="button" class="btn-add-snack" onclick="addSnackRow()">＋ 間食を追加</button>
  <label>変動要因 (ノイズの記録)</label>
  <div class="checkbox-group grid" style="margin-bottom:5px;">
    <label><input type="checkbox" id="tagHoliday"><span class="tag-info">休日(祝休・有休)</span></label>
    <label><input type="checkbox" id="tagNoBM"><span class="tag-warn">便通なし</span></label>
    <label><input type="checkbox" id="tagLunchOut"><span class="tag-warn">昼外食</span></label>
    <label><input type="checkbox" id="tagDinnerOut"><span class="tag-warn">夜外食</span></label>
    <label><input type="checkbox" id="tagAlcohol"><span class="tag-warn">飲酒</span></label>
    <label><input type="checkbox" id="tagSalty"><span class="tag-warn">塩分多め</span></label>
    <label><input type="checkbox" id="tagWorkStress"><span class="tag-warn">残業/ｽﾄﾚｽ</span></label>
    <label><input type="checkbox" id="tagMusclePain"><span class="tag-warn">筋肉痛/疲労</span></label>
  </div>
  <div style="font-size:12px;color:#4facfe;text-decoration:underline;margin-bottom:10px;display:inline-block;cursor:pointer;font-weight:bold;" onclick="$('saltyHint').classList.toggle('hidden')">💡塩分多めの基準を確認</div>
  <div id="saltyHint" class="hidden" style="font-size:12px;background:#fff8e1;color:#b28900;padding:12px;border-radius:12px;margin-bottom:10px;border:1px solid #ffe57f;line-height:1.5;">
    🍜 ラーメン・うどん等の汁 (半分以上)<br>🍛 カレー・丼もの・焼肉 (タレ多め)<br>🥓 ポテチ・ウインナー等 (食後に喉が渇く)
  </div>
  <label>メモ(任意)</label><input type="text" id="memoInput" placeholder="例: 食べすぎた等">
  <button class="btn-save" onclick="saveData()">記録を保存して分析する</button>
</div>

<div class="card">
  <h2>過去の記録</h2>
  <div id="summaryContainer"></div><div id="historyContainer"></div>
</div>

<!-- 緊急データ確認ツール -->
<div class="card" style="background:#fff8e1; border:2px solid #ffc107;">
  <h2 style="color:#b28900; font-size:1em; margin-bottom:5px;">🔧 緊急データ確認ツール</h2>
  <p style="font-size:12px; color:#856404; margin-top:0;">見えなくなっている4.6KBのデータを直接引っ張り出します。<br>ボタンを押し、下の枠に文字が出たら成功です！</p>
  <button onclick="$('rawData').value = localStorage.getItem('myHealthData');" style="padding:12px; background:#ffc107; color:#333; border:none; border-radius:8px; font-weight:bold; margin-bottom:10px; width:100%; cursor:pointer;">1. 金庫の中身を表示する</button>
  <textarea id="rawData" style="width:100%; height:120px; font-size:12px; border:1px solid #ccc; border-radius:8px; padding:8px; box-sizing:border-box;" readonly placeholder="ここにデータが出現します..."></textarea>
  <button onclick="navigator.clipboard.writeText($('rawData').value).then(()=>alert('コピーしました！チャットに貼り付けてください'))" style="padding:12px; background:#343a40; color:white; border:none; border-radius:8px; font-weight:bold; margin-top:10px; width:100%; cursor:pointer;">2. コピーしてAIに送る</button>
</div>

<script>
  const GOAL_KM = 100;
  const $ = id => document.getElementById(id);
  const lm = {'bento':'弁当','onigiri_low':'おにぎり(低)','onigiri_high':'おにぎり(高)','bread':'パン','other':'その他'};
  const md = {'good':'😄 最高！','soso':'🙂 まあまあ','bad':'😣 耐えた…'};
  const getL = (t,c,m) => !t?'':t==='other'?`その他(${m||''})`:t==='bento'?'弁当':`${lm[t]||''}${c||0}個`;
  
  const fmtDate = d => {
    if(!(d instanceof Date) || isNaN(d)) return '';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  };

  $('exRun').addEventListener('change', () => $('runDistWrapper').classList.toggle('hidden', !$('exRun').checked));
  document.querySelectorAll('#exRun,#exMuscleUpper,#exMuscleLower,#exStretch').forEach(el => el.addEventListener('change', e => { if(e.target.checked) $('exNone').checked = false; }));$('exNone').addEventListener('change', e => { if(e.target.checked){ $('exRun').checked=$('exMuscleUpper').checked=$('exMuscleLower').checked=$('exStretch').checked=false; $('runDistWrapper').classList.add('hidden'); }});$('lunchSelect').addEventListener('change', e => { const o = e.target.value === 'other'; $('lunchCount').classList.toggle('hidden', o\vert{}\vert{}e.target.value==='bento');$('lunchMemo').classList.toggle('hidden', !o); });
  $('lunchSelect2').addEventListener('change', e => { const o = e.target.value === 'other';$('lunchCount2').classList.toggle('hidden', o||['bento',''].includes(e.target.value)); $('lunchMemo2').classList.toggle('hidden', !o); });$('btnAddLunch').addEventListener('click', () => { $('lunchRow2').classList.remove('hidden');$('btnAddLunch').style.display='none'; });

  function addSnackRow(time='', cal='', content='') {
    const div = document.createElement('div'); div.className = 'snack-item';
    div.innerHTML = `
      <div class="row" style="margin-bottom:8px;">
        <select class="snack-time" style="flex:2;">
          <option value="">タイミング</option><option value="morning" ${time==='morning'?'selected':''}>朝</option><option value="noon" ${time==='noon'?'selected':''}>昼</option>
          <option value="evening" ${time==='evening'?'selected':''}>夕方</option><option value="before_dinner" ${time==='before_dinner'?'selected':''}>夕食前</option>
          <option value="after_dinner" ${time==='after_dinner'?'selected':''}>夕食後</option><option value="night" ${time==='night'?'selected':''} style="display:none;">夜(旧)</option>
        </select>
        <input type="number" class="snack-cal" style="flex:2;" min="0" placeholder="kcal" value="${cal}">
        <button type="button" class="btn-remove-snack" style="flex:0.6;" onclick="this.parentElement.parentElement.remove()">✖</button>
      </div>
      <input type="text" class="snack-content" placeholder="内容 (例: チョコ)" value="${content}">
    `;
    $('snackContainer').appendChild(div);
  }

  function showFeedback(r) {
    const b = $('feedbackBanner'); b.classList.remove('hidden');
    let burn = 0;
    if(r.run && r.runKm) burn += Math.round(r.weight * r.runKm);
    if(r.muscleUpper || r.muscle) burn += 100; if(r.muscleLower) burn += 100; if(r.stretch) burn += 30;
    let eat = 0; if(r.snacks) r.snacks.forEach(s => eat += (parseInt(s.cal)||0));
    const bal = burn - eat;
    const hasNoise = r.lunchOut || r.dinnerOut || r.alcohol || r.salty || r.noBM;

    let msg1 = "";
    if (r.run && bal >= 0 && !hasNoise) {
      msg1 = "完璧なコントロールですね！文句なしのコンディション管理、本当にお見事です👏";
    } else if (bal < 0) {
      msg1 = "間食の記録バッチリです。「なぜ増えたか」が後から分かるようになるので、この正直さが最大の武器です✨";
    } else if (hasNoise) {
      msg1 = "ノイズ要因もしっかり記録できていますね。明日体重が増えても「水分だ」と笑って流しましょう💧";
    } else if (r.run) {
      msg1 = "走った記録がしっかり残っていますね！着実に力がついている証拠です🔥";
    }

    let msg2 = "";
    if (r.mood === 'good') msg2 = "「最高！」の気分で終えられたのが何よりの収穫ですね😄";
    else if (r.mood === 'bad') msg2 = "しんどい日もこうして記録を開いたご自身を、まずは褒めてあげてください🍀";
    else msg2 = "今日も1日お疲れ様でした！コツコツと自分に向き合えていて素晴らしいです！";
    
    b.innerHTML = msg1 ? `${msg1}<br>${msg2}` : msg2;
  }

  function getSafeData() {
    try {
      let v = localStorage.getItem('myHealthData');
      return v ? JSON.parse(v) : {};
    } catch(e) { return {}; }
  }

  function loadDataForDate() {
    const d = $('dateInput').value; if(!d) return;
    const raw = getSafeData();
    const rd = raw[d] || {};
    $('weightInput').value = rd.weight || '';
    if(rd.mood) {
      let mEl = document.querySelector(`input[name="mood"][value="${rd.mood}"]`);
      if(mEl) mEl.checked = true;
    } else {
      document.querySelectorAll('input[name="mood"]').forEach(el=>el.checked=false);
    }
    $('exRun').checked = rd.run || false; $('runDistInput').value = rd.runKm \vert{}\vert{} '';$('exMuscleUpper').checked = rd.muscleUpper || rd.muscle || false;
    $('exMuscleLower').checked = rd.muscleLower || false;
    $('exStretch').checked = rd.stretch || false;
    $('exNone').checked = (rd.weight && !rd.run && !rd.muscleUpper && !rd.muscleLower && !rd.stretch && !rd.muscle) ? true : false;
    let lt = rd.lunchType || rd.lunch || 'bento'; if(lt==='onigiri') lt='onigiri_low';
    $('lunchSelect').value = lt; $('lunchCount').value = rd.lunchCount || ''; $('lunchMemo').value = rd.lunchMemo \vert{}\vert{} '';$('lunchSelect').dispatchEvent(new Event('change'));
    
    if(rd.lunchType2) { $('lunchRow2').classList.remove('hidden'); $('btnAddLunch').style.display='none';$('lunchSelect2').value=rd.lunchType2; $('lunchCount2').value=rd.lunchCount2\vert{}\vert{}'';$('lunchMemo2').value=rd.lunchMemo2||''; }
    else { $('lunchRow2').classList.add('hidden');$('btnAddLunch').style.display='block'; $('lunchSelect2').value='';$('lunchCount2').value=''; $('lunchMemo2').value=''; }$('lunchSelect2').dispatchEvent(new Event('change'));

    $('snackContainer').innerHTML = '';
    if(rd.snacks) rd.snacks.forEach(s => addSnackRow(s.time, s.cal, s.content));
    $('tagHoliday').checked = rd.holiday || false;
    $('tagLunchOut').checked = rd.lunchOut \vert{}\vert{} false; $('tagDinnerOut').checked = rd.dinnerOut || false;
    $('tagAlcohol').checked = rd.alcohol \vert{}\vert{} false; $('tagSalty').checked = rd.salty || false;
    $('tagNoBM').checked = rd.noBM || false; $('tagWorkStress').checked = rd.workStress \vert{}\vert{} false; $('tagMusclePain').checked = rd.musclePain || false;
    $('memoInput').value = rd.memo || '';
    $('exRun').dispatchEvent(new Event('change'));$('feedbackBanner').classList.add('hidden');
  }
  
  $('dateInput').addEventListener('change', loadDataForDate);$('dateInput').value = fmtDate(new Date());
  loadDataForDate(); updateHistoryList();

  function saveData() {
    const d = $('dateInput').value, w =$('weightInput').value;
    if(!d || !w) return alert('日付と体重は必須です');
    const snacks = [];
    document.querySelectorAll('.snack-item').forEach(i => {
      const t=i.querySelector('.snack-time').value, c=i.querySelector('.snack-cal').value, txt=i.querySelector('.snack-content').value;
      if(t||c||txt) snacks.push({time:t, cal:c?parseInt(c):0, content:txt});
    });
    const moodEl = document.querySelector('input[name="mood"]:checked');
    const moodVal = moodEl ? moodEl.value : '';
    const data = getSafeData();
    const newData = { ...(data[d]||{}), weight:parseFloat(w), mood:moodVal, run:$('exRun').checked, runKm:$('exRun').checked?parseFloat($('runDistInput').value||0):0,
      muscleUpper:$('exMuscleUpper').checked, muscleLower:$('exMuscleLower').checked, stretch:$('exStretch').checked,
      lunchType:$('lunchSelect').value, lunchCount:parseInt($('lunchCount').value\vert{}\vert{}0), lunchMemo:$('lunchMemo').value,
      lunchType2:$('lunchRow2').classList.contains('hidden')?'':$('lunchSelect2').value, lunchCount2:parseInt($('lunchCount2').value\vert{}\vert{}0), lunchMemo2:$('lunchMemo2').value,
      snacks, holiday:$('tagHoliday').checked, lunchOut:$('tagLunchOut').checked, dinnerOut:$('tagDinnerOut').checked, alcohol:$('tagAlcohol').checked, salty:$('tagSalty').checked,
      noBM:$('tagNoBM').checked, workStress:$('tagWorkStress').checked, musclePain:$('tagMusclePain').checked, memo:$('memoInput').value };
    data[d] = newData;
    localStorage.setItem('myHealthData', JSON.stringify(data));
    showFeedback(newData);
    updateHistoryList();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function updateHistoryList() {
    const raw = getSafeData();
    const dates = Object.keys(raw).sort((a,b)=>b.localeCompare(a));
    if(!dates.length) { $('summaryContainer').innerHTML='データなし'; $('historyContainer').innerHTML='<p>記録がありません</p>'; $('streakBadge').innerHTML='記録なし'; return; }
    
    let streak = 0; const today = new Date();
    for(let i=0; i<365; i++) {
      const d = new Date(today); d.setDate(d.getDate()-i); const ds = fmtDate(d);
      if(raw[ds] && raw[ds].weight) streak++; else if(i > 0) break; 
    }
    $('streakBadge').innerHTML = streak > 0 ? `📅 連続記録：${streak}日目` : `記録なし`;

    let mRun=0, mBurn=0, mEat=0;
    const currMonth = today.getMonth();
    
    dates.forEach(d => {
      const rd = raw[d];
      if(rd.weight && new Date(d).getMonth() === currMonth) { 
        if(rd.run) mRun += rd.runKm||0;
        let burn = 0; if(rd.run) burn += Math.round(rd.weight * rd.runKm);
        if(rd.muscleUpper||rd.muscle) burn += 100; if(rd.muscleLower) burn += 100; if(rd.stretch) burn += 30;
        mBurn += burn; if(rd.snacks) rd.snacks.forEach(s => mEat += (parseInt(s.cal)||0));
      }
    });
    
    const progPct = Math.min(100, (mRun / GOAL_KM) * 100);
    const mBal = mBurn - mEat; const mFat = Math.round(mBal / 7.2);
    const fatHtml = mBal >= 0 ? `<span style="color:#28a745">🔥 ${mFat}gの脂肪燃焼相当</span>` : `<span style="color:#dc3545">⚠️ ${Math.abs(mFat)}gの脂肪蓄積相当</span>`;
    
    $('summaryContainer').innerHTML = `<div style="text-align:left;">
      <div style="font-size:13px;color:#666;font-weight:bold;margin-bottom:4px;">🏃 月間走行距離: ${mRun.toFixed(1)} / ${GOAL_KM}km</div>
      <div class="prog-bg"><div class="prog-bar" style="width:${progPct}%"></div></div>
      <div style="font-size:13px;color:#666;font-weight:bold;margin-top:10px;">🥩 今月のカロリー貯金: ${mBal>0?'+':''}${mBal}kcal</div>
      <div style="font-size:15px;margin-top:2px;">${fatHtml}</div></div>`;
    
    let html='';
    const tm = {'morning':'朝','noon':'昼','evening':'夕方','before_dinner':'夕食前','after_dinner':'夕食後','night':'夜'};
    dates.forEach(d => {
      const r = raw[d]; if(!r.weight) return;
      let burn = 0; if(r.run && r.runKm) burn += Math.round(r.weight * r.runKm);
      if(r.muscleUpper || r.muscle) burn += 100; if(r.muscleLower) burn += 100; if(r.stretch) burn += 30;
      let eat = 0; if(r.snacks) r.snacks.forEach(s => eat += (parseInt(s.cal)||0));
      
      const bal = burn - eat;
      const balHtml = bal >= 0 ? `<div class="bal-box bal-plus">🔥消費${burn} - 🍩間食${eat} = ＋${bal}kcal</div>` : `<div class="bal-box bal-minus">🔥消費${burn} - 🍩間食${eat} = ${bal}kcal</div>`;
      let isPerfect = r.run && (bal >= 0) && !r.lunchOut && !r.dinnerOut && !r.alcohol && !r.salty;
      const perfHtml = isPerfect ? `<span style="background:linear-gradient(45deg, #ffd700, #ffa500);color:#fff;font-size:11px;padding:2px 8px;border-radius:12px;margin-left:8px;font-weight:bold;">👑 PERFECT</span>` : '';

      const ex=[]; if(r.run) ex.push(`ラン${r.runKm}km`); if(r.muscleUpper||r.muscle) ex.push('筋(上)'); if(r.muscleLower) ex.push('筋(下)'); if(r.stretch) ex.push('ｽﾄﾚｯﾁ');
      let lTxt = getL(r.lunchType, r.lunchCount, r.lunchMemo); if(r.lunchType2) lTxt += ' ＋ ' + getL(r.lunchType2, r.lunchCount2, r.lunchMemo2);
      const sTxt = (r.snacks&&r.snacks.length) ? r.snacks.map(s=>`${tm[s.time]||''} ${s.content}(${s.cal?s.cal+'kcal':''})`).join(', ') : 'なし';
      const tgs=[]; if(r.holiday) tgs.push("休日"); if(r.lunchOut) tgs.push("昼外食"); if(r.dinnerOut) tgs.push("夜外食"); if(r.alcohol) tgs.push("飲酒"); if(r.salty) tgs.push("塩分多め");
      if(r.noBM) tgs.push("便通なし"); if(r.workStress) tgs.push("残業/ｽﾄﾚｽ"); if(r.musclePain) tgs.push("筋肉痛/疲労");
      const moodTxt = r.mood ? `<span style="margin-right:8px;font-size:16px;">${md[r.mood]}</span>` : '';

      html += `<div style="border-bottom:1px solid #f0f2f5;padding:16px 0;"><div style="display:flex;align-items:center;margin-bottom:6px;">${moodTxt}<span style="font-weight:bold;color:#4facfe;font-size:16px;">${d} : ${r.weight}kg</span>${perfHtml}</div>
        ${balHtml}
        <div style="color:#666;line-height:1.6;margin-top:8px;font-size:13px;">🏃 ${ex.length?ex.join(', '):'なし'} | 🍙 ${lTxt}<br>🍩 間食: ${sTxt}<br>⚠️ 要因: ${tgs.length?tgs.join('・'):'なし'}${r.memo?`<br>📝 ${r.memo}`:''}</div></div>`;
    }); $('historyContainer').innerHTML = html;
  }
</script>
</body>
</html>
