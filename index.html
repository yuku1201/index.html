<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>体重・運動記録</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: sans-serif; padding: 15px; margin: 0; background: #f0f2f5; color: #333; }
  .card { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  h2 { font-size: 1.2em; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
  label { display: block; margin: 12px 0 6px; font-weight: bold; font-size: 14px; color: #444; }
  input[type="number"], input[type="text"], input[type="date"], select { 
    width: 100%; padding: 12px; box-sizing: border-box; 
    border: 1px solid #ccc; border-radius: 8px; font-size: 16px; 
  }
  .row { display: flex; gap: 10px; margin-bottom: 8px; }
  .row > * { flex: 1; }
  
  .checkbox-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .checkbox-group label { 
    display: inline-flex; align-items: center; background: #f8f9fa; 
    padding: 10px 15px; border-radius: 25px; border: 1px solid #ddd; 
    font-weight: normal; margin: 0; cursor: pointer; transition: 0.2s;
  }
  .checkbox-group input:checked + span.tag-ex { color: #28a745; font-weight: bold; }
  .checkbox-group input:checked + span.tag-warn { color: #dc3545; font-weight: bold; }
  .checkbox-group input { display: none; } 
  .checkbox-group label:has(input:checked) { background: #e9ecef; border-color: #adb5bd; }

  .hidden { display: none !important; }
  
  .snack-item { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; position: relative; }
  .btn-remove-snack { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 8px 12px; margin-top: 5px; cursor: pointer; width: 100%; font-size: 14px;}
  .btn-add-snack { background: #fff; color: #007bff; border: 2px dashed #007bff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }

  .btn-save { background: #007bff; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 10px; cursor: pointer; }
  .btn-export { background: #343a40; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
  
  .btn-group { display: flex; gap: 5px; margin-bottom: 15px; }
  .btn-group button { flex: 1; background: #e9ecef; border: none; padding: 10px; border-radius: 6px; font-size: 14px; color: #495057; }
  .btn-group button.active { background: #007bff; color: #fff; }
</style>
</head>
<body>

<div class="card">
  <h2>記録・修正</h2>
  <label>日付</label>
  <input type="date" id="dateInput">

  <label>体重 (kg)</label>
  <input type="number" step="0.1" id="weightInput" placeholder="例: 65.5">

  <label>運動 (複数選択可)</label>
  <div class="checkbox-group">
    <label><input type="checkbox" id="exRun" value="run"><span class="tag-ex">ラン</span></label>
    <label><input type="checkbox" id="exMuscle" value="muscle"><span class="tag-ex">筋トレ</span></label>
    <label><input type="checkbox" id="exNone" value="none"><span>なし(休養)</span></label>
  </div>
  <div id="runDistWrapper" class="hidden">
    <label>ラン距離 (km)</label>
    <input type="number" step="0.1" id="runDistInput" placeholder="例: 10">
  </div>

  <label>昼食</label>
  <div class="row">
    <select id="lunchSelect">
      <option value="onigiri_low">おにぎり (低脂質:梅/鮭等)</option>
      <option value="onigiri_high">おにぎり (高脂質:ツナマヨ等)</option>
      <option value="bread">パン (惣菜/菓子パン)</option>
      <option value="other">その他</option>
    </select>
    <input type="number" id="lunchCount" min="0" placeholder="個数 (例: 2)">
  </div>

  <label>間食</label>
  <div id="snackContainer"></div>
  <button type="button" class="btn-add-snack" onclick="addSnackRow()">＋ 間食を追加する</button>

  <label>その他の変動要因 (当てはまるものタップ)</label>
  <div class="checkbox-group">
    <label><input type="checkbox" id="tagLunchOut"><span class="tag-warn">昼外食</span></label>
    <label><input type="checkbox" id="tagDinnerOut"><span class="tag-warn">夜外食</span></label>
    <label><input type="checkbox" id="tagAlcohol"><span class="tag-warn">飲酒あり</span></label>
  </div>

  <label>一言メモ (任意)</label>
  <input type="text" id="memoInput" placeholder="例: 飲み会で食べすぎた、等">

  <button class="btn-save" onclick="saveData()">保存する</button>
</div>

<div class="card">
  <h2>データ分析</h2>
  <canvas id="weightChart"></canvas>
  <div class="btn-group" style="margin-top:15px;">
    <button id="btn1w" onclick="drawChart(7)">1週間</button>
    <button id="btn1m" onclick="drawChart(30)">1ヶ月</button>
    <button id="btn6m" onclick="drawChart(180)">半年</button>
  </div>
  <button class="btn-export" onclick="exportForAI()">🤖 AI分析用にデータをコピー</button>
</div>

<script>
  document.getElementById('exRun').addEventListener('change', (e) => {
    document.getElementById('runDistWrapper').classList.toggle('hidden', !e.target.checked);
    if(e.target.checked) document.getElementById('exNone').checked = false;
  });
  document.getElementById('exMuscle').addEventListener('change', (e) => {
    if(e.target.checked) document.getElementById('exNone').checked = false;
  });
  document.getElementById('exNone').addEventListener('change', (e) => {
    if(e.target.checked) {
      document.getElementById('exRun').checked = false;
      document.getElementById('exMuscle').checked = false;
      document.getElementById('runDistWrapper').classList.add('hidden');
    }
  });

  function addSnackRow(time = '', cal = '', content = '') {
    const container = document.getElementById('snackContainer');
    const div = document.createElement('div');
    div.className = 'snack-item';
    div.innerHTML = `
      <div class="row">
        <select class="snack-time">
          <option value="">タイミング</option>
          <option value="morning" ${time==='morning'?'selected':''}>朝</option>
          <option value="noon" ${time==='noon'?'selected':''}>昼</option>
          <option value="evening" ${time==='evening'?'selected':''}>夕方</option>
          <option value="night" ${time==='night'?'selected':''}>夜</option>
        </select>
        <input type="number" class="snack-cal" min="0" placeholder="kcal" value="${cal}">
      </div>
      <input type="text" class="snack-content" placeholder="内容 (例: チョコレート)" value="${content}">
      <button type="button" class="btn-remove-snack" onclick="this.parentElement.remove()">削除</button>
    `;
    container.appendChild(div);
  }

  let chartInstance = null;

  function loadDataForDate() {
    const date = document.getElementById('dateInput').value;
    if (!date) return;

    const rawData = JSON.parse(localStorage.getItem('myHealthData') || '{}');
    const data = rawData[date] || {};

    document.getElementById('weightInput').value = data.weight || '';
    document.getElementById('exRun').checked = data.run || false;
    document.getElementById('runDistInput').value = data.runKm || '';
    document.getElementById('exMuscle').checked = data.muscle || false;
    document.getElementById('exNone').checked = (data.weight && !data.run && !data.muscle) ? true : false;
    
    // 昼食の互換性処理を含む
    let lType = data.lunchType || data.lunch || 'onigiri_low';
    if(lType === 'onigiri') lType = 'onigiri_low'; 
    document.getElementById('lunchSelect').value = lType;
    document.getElementById('lunchCount').value = data.lunchCount || '';
    
    const container = document.getElementById('snackContainer');
    container.innerHTML = ''; 
    if (data.snacks && data.snacks.length > 0) {
      data.snacks.forEach(s => addSnackRow(s.time, s.cal, s.content));
    }
    
    document.getElementById('tagLunchOut').checked = data.lunchOut || false;
    document.getElementById('tagDinnerOut').checked = data.dinnerOut || false;
    document.getElementById('tagAlcohol').checked = data.alcohol || false;
    document.getElementById('memoInput').value = data.memo || '';
    
    document.getElementById('exRun').dispatchEvent(new Event('change'));
  }

  document.getElementById('dateInput').addEventListener('change', loadDataForDate);
  document.getElementById('dateInput').value = new Date().toLocaleDateString('sv-SE');
  loadDataForDate();

  function saveData() {
    const date = document.getElementById('dateInput').value;
    const weight = document.getElementById('weightInput').value;
    if(!date || !weight) { alert('日付と体重は必須です'); return; }

    const snacks = [];
    document.querySelectorAll('.snack-item').forEach(item => {
      const time = item.querySelector('.snack-time').value;
      const cal = item.querySelector('.snack-cal').value;
      const content = item.querySelector('.snack-content').value;
      if(time || cal || content) {
        snacks.push({ time, cal: cal ? parseInt(cal) : 0, content });
      }
    });

    const data = JSON.parse(localStorage.getItem('myHealthData') || '{}');
    data[date] = {
      ...(data[date] || {}),
      weight: parseFloat(weight),
      run: document.getElementById('exRun').checked,
      runKm: document.getElementById('exRun').checked ? parseFloat(document.getElementById('runDistInput').value || 0) : 0,
      muscle: document.getElementById('exMuscle').checked,
      lunchType: document.getElementById('lunchSelect').value,
      lunchCount: document.getElementById('lunchCount').value ? parseInt(document.getElementById('lunchCount').value) : 0,
      snacks: snacks,
      lunchOut: document.getElementById('tagLunchOut').checked,
      dinnerOut: document.getElementById('tagDinnerOut').checked,
      alcohol: document.getElementById('tagAlcohol').checked,
      memo: document.getElementById('memoInput').value
    };

    localStorage.setItem('myHealthData', JSON.stringify(data));
    alert('記録を保存しました！');
    drawChart(30); 
  }

  function exportForAI() {
    const rawData = JSON.parse(localStorage.getItem('myHealthData') || '{}');
    const dates = Object.keys(rawData).sort();
    if(dates.length === 0) { alert('データがありません。'); return; }
    
    let csv = "日付,体重,ラン距離(km),筋トレ,昼食,昼食個数,間食,外食・飲酒,メモ\n";
    const lunchMap = {'onigiri_low':'おにぎり(低脂質)', 'onigiri_high':'おにぎり(高脂質)', 'bread':'パン', 'other':'その他'};
    
    dates.forEach(d => {
      const r = rawData[d];
      let snacksText = "なし";
      if(r.snacks && r.snacks.length > 0) {
        snacksText = r.snacks.map(s => `${s.time}:${s.content}(${s.cal}kcal)`).join(' / ');
      }
      
      const tags = [];
      if(r.lunchOut) tags.push("昼外食");
      if(r.dinnerOut) tags.push("夜外食");
      if(r.alcohol) tags.push("飲酒");
      const tagsText = tags.length > 0 ? tags.join('・') : 'なし';

      csv += `${d},${r.weight},${r.run ? r.runKm : 0},${r.muscle ? '有' : '無'},${lunchMap[r.lunchType] || ''},${r.lunchCount || 0},${snacksText},${tagsText},${r.memo || ''}\n`;
    });

    navigator.clipboard.writeText(csv).then(() => {
      alert("データをコピーしました！\nGeminiなどのAIに貼り付けて「このデータから体重増減の傾向を分析して」と伝えてください。");
    }).catch(err => {
      alert("コピーに失敗しました。ブラウザの設定を確認してください。");
    });
  }

  function drawChart(days) {
    ['btn1w', 'btn1m', 'btn6m'].forEach(id => document.getElementById(id).classList.remove('active'));
    if(days === 7) document.getElementById('btn1w').classList.add('active');
    if(days === 30) document.getElementById('btn1m').classList.add('active');
    if(days === 180) document.getElementById('btn6m').classList.add('active');

    const rawData = JSON.parse(localStorage.getItem('myHealthData') || '{}');
    const labels = [];
    const weights = [];
    const pointColors = [];
    const today = new Date();
    
    for(let i = days - 1; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dateStr = d.toLocaleDateString('sv-SE');
      labels.push(dateStr.slice(5).replace('-', '/')); 
      
      const dayData = rawData[dateStr];
      if(dayData && dayData.weight) {
        weights.push(dayData.weight);
        if(dayData.lunchOut || dayData.dinnerOut || dayData.alcohol) {
          pointColors.push('rgba(220, 53, 69, 1)'); // 赤（増量要因あり）
        } else if (dayData.run || dayData.muscle) {
          pointColors.push('rgba(40, 167, 69, 1)'); // 緑（運動あり）
        } else {
          pointColors.push('#007bff'); // 青（通常）
        }
      } else {
        weights.push(null);
        pointColors.push('#007bff');
      }
    }

    const ctx = document.getElementById('weightChart').getContext('2d');
    if(chartInstance) chartInstance.destroy(); 

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '体重 (kg)',
          data: weights,
          borderColor: 'rgba(0,123,255,0.3)',
          backgroundColor: 'transparent',
          pointBackgroundColor: pointColors,
          pointBorderColor: pointColors,
          borderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          spanGaps: true, tension: 0.1
        }]
      },
      options: { 
        responsive: true, 
        plugins: { 
          legend: { display: false },
          tooltip: {
            callbacks: {
              afterLabel: function(context) {
                const dateIdx = context.dataIndex;
                const d = new Date(today);
                d.setDate(d.getDate() - (days - 1) + dateIdx);
                const dateStr = d.toLocaleDateString('sv-SE');
                const dayData = rawData[dateStr];
                
                let details = [];
                if(dayData) {
                  const lunchMap = {'onigiri_low':'おにぎり(低脂質)', 'onigiri_high':'おにぎり(高脂質)', 'bread':'パン', 'other':'その他'};
                  if(dayData.lunchType) {
                    details.push(`昼食: ${lunchMap[dayData.lunchType]} ${dayData.lunchCount || 0}個`);
                  }
                  
                  const tags = [];
                  if(dayData.lunchOut) tags.push("昼外食");
                  if(dayData.dinnerOut) tags.push("夜外食");
                  if(dayData.alcohol) tags.push("飲酒");
                  if(tags.length > 0) details.push(`要因: ${tags.join(', ')}`);

                  if(dayData.snacks && dayData.snacks.length > 0) {
                    dayData.snacks.forEach((s, idx) => {
                      let sTime = {'morning':'朝', 'noon':'昼', 'evening':'夕方', 'night':'夜'}[s.time] || '';
                      details.push(`間食${idx+1}: ${sTime} ${s.content} (${s.cal}kcal)`);
                    });
                  }
                  if(dayData.memo) details.push(`メモ: ${dayData.memo}`);
                }
                return details;
              }
            }
          }
        } 
      }
    });
  }

  drawChart(30);
</script>
</body>
</html>
